name: Scheduler

on:
  schedule:
    # Every 5 minutes. GitHub may delay this several minutes under load;
    # SCHEDULER_WINDOW_MINUTES (in scheduler/run.py) absorbs the jitter and
    # the state cache below ensures a reminder still fires exactly once.
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "vault/**"
      - "scheduler/**"
      - ".github/workflows/scheduler.yml"

permissions:
  contents: read

concurrency:
  group: scheduler
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scheduler/requirements.txt

      - name: Install scheduler deps
        run: pip install -r scheduler/requirements.txt

      - name: Restore scheduler state
        uses: actions/cache/restore@v4
        with:
          path: scheduler/.state.json
          # Primary key is unique per run so we always miss it and fall back
          # to the prefix, restoring whatever the most recent run saved.
          key: scheduler-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            scheduler-state-

      - name: Run scheduler tick
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SCHEDULER_WINDOW_MINUTES: "15"
        run: python -m scheduler.run

      - name: Save scheduler state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scheduler/.state.json
          key: scheduler-state-${{ github.run_id }}-${{ github.run_attempt }}
